[project]
name = "qfpm-multi-agent"
version = "0.1.0"
description = "Independent multi-agent Asian Handicap research and audit workflow"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.4.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
